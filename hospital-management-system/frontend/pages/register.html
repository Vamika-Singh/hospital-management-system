<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — MediCare</title>
  <meta name="description" content="Register for a free MediCare patient account to book appointments with top doctors." />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <style>
    .auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:calc(var(--header-height)+40px) 20px 60px; }
    .auth-bg { position:fixed; inset:0; background:radial-gradient(ellipse at 70% 30%, rgba(14,165,233,0.08) 0%, transparent 60%); pointer-events:none; }
    .auth-card { width:100%; max-width:560px; background:var(--bg-surface); border:1px solid var(--border); border-radius:var(--radius-xl); padding:40px; box-shadow:var(--shadow-lg); }
    .auth-header { text-align:center; margin-bottom:32px; }
    .auth-icon { width:60px; height:60px; background:linear-gradient(135deg,var(--primary),var(--accent)); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 16px; }
    .auth-header h1 { font-size:24px; margin-bottom:8px; }
    .auth-header p { color:var(--text-secondary); font-size:14px; }
    .error-alert { background:var(--danger-light); border:1px solid rgba(239,68,68,0.3); border-radius:var(--radius-sm); padding:12px 16px; color:#991b1b; font-size:13px; margin-bottom:20px; display:none; }
    .error-alert.show { display:block; }
    .section-divider { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.1em; margin:24px 0 16px; padding-bottom:8px; border-bottom:1px solid var(--border-light); }
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"></nav>
  <div id="toast-container"></div>
  <div class="auth-bg"></div>

  <div class="auth-page">
    <div class="auth-card animate-fade-in">
      <div class="auth-header">
        <div class="auth-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color:white"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
        <h1>Create Your Account</h1>
        <p>Join MediCare and book your first appointment today</p>
      </div>

      <div class="error-alert" id="error-alert"></div>

      <form id="register-form" novalidate>
        <div class="section-divider">Personal Information</div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="name">Full Name *</label>
            <input type="text" id="name" class="form-control" placeholder="Priya Sharma" autocomplete="name" />
            <span class="form-error">Full name is required.</span>
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email Address *</label>
            <input type="email" id="email" class="form-control" placeholder="priya@email.com" autocomplete="email" />
            <span class="form-error">Valid email is required.</span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="password">Password *</label>
            <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" autocomplete="new-password" />
            <div class="password-strength">
              <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
              <div class="strength-text" id="strength-text">Enter a password</div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="9876543210" autocomplete="tel" />
            <span class="form-error">Enter a valid 10-digit mobile number.</span>
          </div>
        </div>

        <div class="section-divider">Additional Details (Optional)</div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="dob">Date of Birth</label>
            <input type="date" id="dob" class="form-control" />
          </div>
          <div class="form-group">
            <label class="form-label" for="gender">Gender</label>
            <select id="gender" class="form-control">
              <option value="">Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="blood_group">Blood Group</label>
            <select id="blood_group" class="form-control">
              <option value="">Select blood group</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="address">Address</label>
            <input type="text" id="address" class="form-control" placeholder="City, State" autocomplete="address-level2" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg w-full" id="register-btn" style="margin-top:8px;">
          Create Account →
        </button>

        <p style="text-align:center; margin-top:20px; font-size:13px; color:var(--text-secondary);">
          Already have an account? <a href="/pages/login.html">Sign in here</a>
        </p>
      </form>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderNavbar();
      redirectIfLoggedIn();
    });

    // Password strength indicator
    document.getElementById('password').addEventListener('input', (e) => {
      const val = e.target.value;
      const fill = document.getElementById('strength-fill');
      const text = document.getElementById('strength-text');
      fill.className = 'strength-fill';
      if (!val) { text.textContent = 'Enter a password'; return; }
      if (val.length < 6) { fill.classList.add('weak'); text.textContent = 'Too weak'; }
      else if (val.length < 10) { fill.classList.add('medium'); text.textContent = 'Moderate'; }
      else { fill.classList.add('strong'); text.textContent = 'Strong password'; }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const phone = document.getElementById('phone').value.trim();
      const dob = document.getElementById('dob').value;
      const gender = document.getElementById('gender').value;
      const blood_group = document.getElementById('blood_group').value;
      const address = document.getElementById('address').value.trim();
      const errorAlert = document.getElementById('error-alert');
      const btn = document.getElementById('register-btn');

      clearAllErrors('register-form');
      errorAlert.classList.remove('show');
      let hasError = false;

      const nameRegex = /^[a-zA-Z\s'.]+$/;
      if (!name) {
        showFieldError('name', 'Full name is required.');
        hasError = true;
      } else if (name.length < 2) {
        showFieldError('name', 'Name must be at least 2 characters long.');
        hasError = true;
      } else if (!nameRegex.test(name)) {
        showFieldError('name', 'Name can only contain letters, spaces, dots, or apostrophes.');
        hasError = true;
      }

      if (!email || !validateEmail(email)) { showFieldError('email', 'Valid email is required.'); hasError = true; }
      if (!password || password.length < 6) { showFieldError('password', 'Password must be at least 6 characters.'); hasError = true; }
      if (phone && !validatePhone(phone)) { showFieldError('phone', 'Enter a valid 10-digit mobile number.'); hasError = true; }
      if (hasError) return;

      btn.classList.add('btn-loading');
      btn.disabled = true;

      const res = await api.post('/auth/register', { name, email, password, phone, dob, gender, blood_group, address });

      btn.classList.remove('btn-loading');
      btn.disabled = false;

      if (res && res.success) {
        setAuth(res.data.token, res.data.user);
        showToast('success', 'Account Created!', 'Welcome to MediCare! Redirecting...');
        setTimeout(() => window.location.href = getCorrectUrl('/pages/patient-dashboard.html'), 1200);
      } else {
        errorAlert.textContent = res?.message || 'Registration failed. Please try again.';
        errorAlert.classList.add('show');
      }
    });
  </script>
</body>
</html>
