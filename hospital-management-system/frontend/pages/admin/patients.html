<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Patients — MediCare Admin</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="../../pages/index.html" class="sidebar-brand">
          <div class="sidebar-brand-icon" style="width: 32px; height: 32px;"><svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="40" rx="10" fill="#1a56db"/><path d="M20 10v20M10 20h20" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="20" r="14" stroke="#60a5fa" stroke-width="1.5" opacity=".4"/></svg></div>
          <span class="sidebar-brand-name">MediCare Admin</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section">
          <div class="sidebar-section-label">Overview</div>
          <a href="/pages/admin/dashboard.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></span> Dashboard</a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-label">Management</div>
          <a href="/pages/admin/doctors.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></span> Doctors</a>
          <a href="/pages/admin/nurses.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span> Nurses</a>
          <a href="/pages/admin/patients.html" class="sidebar-link active"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span> Patients</a>
          <a href="/pages/admin/appointments.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span> Appointments</a>
          <a href="/pages/admin/beds.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20M5 17V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v12M9 8h6M9 12h6"></path></svg></span> Bed Occupancy</a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-label">Tools</div>
          <a href="/pages/admin/announcement.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></span> Announcement</a>
          <a href="/pages/index.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></span> View Website</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="sidebar-avatar">A</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-name">Admin</div>
            <div class="sidebar-user-role">Administrator</div>
          </div>
        </div>
        <button class="btn btn-secondary w-full btn-sm" onclick="logout()">Logout</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <div class="dashboard-topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
          <div class="topbar-title">Manage Patients</div>
        </div>
        <div class="topbar-actions">
          <span id="patient-count" style="font-size:13px;color:var(--text-secondary);"></span>
        </div>
      </div>

      <div class="dashboard-content">
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="search-bar" style="max-width:350px;">
              <span class="search-icon">🔍</span>
              <input type="text" id="search-input" placeholder="Search by name, email, or phone..." oninput="loadPatients()" />
            </div>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="table">
            <thead><tr><th>#</th><th>Name</th><th>Contact</th><th>DOB / Gender</th><th>Blood Group</th><th>Registered On</th><th>Actions</th></tr></thead>
            <tbody id="patients-tbody"><tr><td colspan="7"><div class="loader"><div class="spinner"></div></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Patient Detail Modal -->
  <div class="modal-overlay" id="patient-modal">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">Patient Details</div><button class="modal-close" onclick="closeModal('patient-modal')">✕</button></div>
      <div class="modal-body" id="patient-detail"></div>
      <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('patient-modal')">Close</button></div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      requireAdminLogin();
      initSidebarToggle();
      const user = getUser();
      document.getElementById('sidebar-name').textContent = user.name;
      document.getElementById('sidebar-avatar').textContent = user.name.charAt(0);
      loadPatients();
    });

    let searchTimeout;
    document.getElementById && document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('search-input')?.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(loadPatients, 400);
      });
    });

    async function loadPatients() {
      const q = document.getElementById('search-input').value.trim();
      const params = q ? `?search=${encodeURIComponent(q)}` : '';
      const res = await api.get(`/admin/patients${params}`, true);
      const tbody = document.getElementById('patients-tbody');

      if (!res || !res.success) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">⚠️</div><h3>Failed to load patients</h3></div></td></tr>';
        return;
      }

      const patients = res.data;
      document.getElementById('patient-count').textContent = `${patients.length} patient${patients.length !== 1 ? 's' : ''}`;

      if (patients.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-icon">👥</div><h3>No patients found</h3></div></td></tr>';
        return;
      }

      tbody.innerHTML = patients.map(p => `
        <tr>
          <td>#${p.id}</td>
          <td><strong>${p.name}</strong></td>
          <td>${p.email}<br><span style="font-size:12px;color:var(--text-muted);">${p.phone || '—'}</span></td>
          <td>${p.dob ? formatDate(p.dob) : '—'}<br><span style="font-size:12px;color:var(--text-muted);">${p.gender || '—'}</span></td>
          <td>${p.blood_group ? `<span class="badge badge-confirmed">${p.blood_group}</span>` : '—'}</td>
          <td>${formatDate(p.created_at)}</td>
          <td><button class="btn btn-secondary btn-sm" onclick="viewPatient(${p.id})">View</button></td>
        </tr>
      `).join('');
    }

    async function viewPatient(id) {
      const res = await api.get('/admin/patients', true);
      if (!res || !res.success) return;
      const p = res.data.find(pt => pt.id === id);
      if (!p) return;

      document.getElementById('patient-detail').innerHTML = `
        <div style="display:flex;flex-direction:column;gap:12px;">
          <div style="display:flex;align-items:center;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--border-light);">
            <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:white;">${p.name.charAt(0).toUpperCase()}</div>
            <div><div style="font-size:18px;font-weight:700;">${p.name}</div><div style="font-size:13px;color:var(--primary);">Patient #${p.id}</div></div>
          </div>
          ${[['Email', p.email],['Phone', p.phone||'—'],['Date of Birth', p.dob ? formatDate(p.dob):'—'],['Gender', p.gender||'—'],['Blood Group', p.blood_group||'—'],['Address', p.address||'—'],['Registered On', formatDate(p.created_at)]].map(([l,v])=>`
            <div style="display:flex;justify-content:space-between;font-size:14px;">
              <span style="color:var(--text-secondary);">${l}</span><strong>${v}</strong>
            </div>
          `).join('')}
        </div>
      `;
      openModal('patient-modal');
    }
  </script>
</body>
</html>
