        <div class="sidebar-section">
          <div class="sidebar-section-label">Overview</div>
          <a href="/pages/admin/dashboard.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></span> Dashboard</a>

          <a href="/pages/admin/doctors.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></span> Doctors</a>
          <a href="/pages/admin/nurses.html" class="sidebar-link active"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span> Nurses</a>
          <a href="/pages/admin/patients.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span> Patients</a>
          <a href="/pages/admin/appointments.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span> Appointments</a>

          <a href="/pages/admin/announcement.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></span> Announcement</a>
          <a href="/pages/index.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></span> View Website</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="sidebar-avatar">A</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-name">Admin</div>
            <div class="sidebar-user-role">Administrator</div>
          </div>
        </div>
        <button class="btn btn-secondary w-full btn-sm" onclick="logout()">Logout</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <div class="dashboard-topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
          <div class="topbar-title">Manage Nurses</div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary btn-sm" onclick="openAddModal()">+ Add Nurse</button>
        </div>
      </div>

      <div class="dashboard-content">
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="search-bar" style="max-width:300px;">
              <span class="search-icon">🔍</span>
              <input type="text" id="search-input" placeholder="Search nurses..." oninput="filterTable()" />
            </div>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="table" id="nurses-table">
            <thead><tr>
              <th>#</th><th>Name</th><th>Email</th><th>Phone</th><th>Department</th><th>Shift</th><th>Status</th><th>Actions</th>
            </tr></thead>
            <tbody id="nurses-tbody">
              <tr><td colspan="8"><div class="loader"><div class="spinner"></div></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Nurse Modal -->
  <div class="modal-overlay" id="nurse-modal">
    <div class="modal" style="max-width:540px;">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">Add New Nurse</div>
        <button class="modal-close" onclick="closeModal('nurse-modal')">✕</button>
      </div>
      <div class="modal-body">
        <form id="nurse-form" novalidate>
          <input type="hidden" id="nurse-id" />
          <div class="form-row">
            <div class="form-group"><label class="form-label">Full Name *</label><input type="text" id="n-name" class="form-control" placeholder="Nurse Name" /></div>
            <div class="form-group"><label class="form-label">Email *</label><input type="email" id="n-email" class="form-control" placeholder="nurse@hospital.com" /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Phone</label><input type="tel" id="n-phone" class="form-control" placeholder="Phone Number" /></div>
            <div class="form-group">
              <label class="form-label">Department *</label>
              <select id="n-dept" class="form-control">
                <option value="">Select Department</option>
                <option value="Cardiology">Cardiology</option>
                <option value="Neurology">Neurology</option>
                <option value="Orthopedics">Orthopedics</option>
                <option value="Pediatrics">Pediatrics</option>
                <option value="General Medicine">General Medicine</option>
                <option value="ICU">ICU</option>
                <option value="Dermatology">Dermatology</option>
                <option value="Gynecology">Gynecology</option>
                <option value="Ophthalmology">Ophthalmology</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Shift *</label>
              <select id="n-shift" class="form-control">
                <option value="Morning">Morning Shift</option>
                <option value="Evening">Evening Shift</option>
                <option value="Night">Night Shift</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Status</label>
              <select id="n-status" class="form-control">
                <option value="1">Active</option>
                <option value="0">Inactive</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('nurse-modal')">Cancel</button>
        <button class="btn btn-primary" id="save-nurse-btn" onclick="saveNurse()">Save Nurse</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script>
    let allNurses = [];

    document.addEventListener('DOMContentLoaded', async () => {
      requireAdminLogin();
      initSidebarToggle();
      const user = getUser();
      document.getElementById('sidebar-name').textContent = user.name;
      document.getElementById('sidebar-avatar').textContent = user.name.charAt(0);
      await loadNurses();
    });

    async function loadNurses() {
      const res = await api.get('/admin/nurses', true);
      if (!res || !res.success) { showToast('error', 'Error', 'Failed to load nurses.'); return; }
      allNurses = res.data;
      renderTable(allNurses);
    }

    function renderTable(nurses) {
      const tbody = document.getElementById('nurses-tbody');
      if (nurses.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><div class="empty-icon">🩺</div><h3>No nurses found</h3></div></td></tr>';
        return;
      }
      tbody.innerHTML = nurses.map(n => `
        <tr>
          <td>#${n.id}</td>
          <td><strong>${n.name}</strong></td>
          <td>${n.email}</td>
          <td>${n.phone || '—'}</td>
          <td><span class="badge badge-info" style="background:var(--primary-light); color:var(--primary); font-weight:600;">${n.department}</span></td>
          <td><strong>${n.shift}</strong></td>
          <td><span class="badge ${n.is_active ? 'badge-active' : 'badge-inactive'}">${n.is_active ? 'Active' : 'Inactive'}</span></td>
          <td>
            <div class="table-actions">
              <button class="btn btn-secondary btn-sm" onclick="openEditModal(${n.id})">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteNurse(${n.id}, '${n.name}')">Delete</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterTable() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const filtered = allNurses.filter(n => 
        n.name.toLowerCase().includes(q) || 
        n.department.toLowerCase().includes(q) || 
        n.email.toLowerCase().includes(q)
      );
      renderTable(filtered);
    }

    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Add New Nurse';
      document.getElementById('nurse-form').reset();
      document.getElementById('nurse-id').value = '';
      document.getElementById('n-shift').value = 'Morning';
      document.getElementById('n-status').value = '1';
      openModal('nurse-modal');
    }

    function openEditModal(id) {
      const n = allNurses.find(nurse => nurse.id === id);
      if (!n) return;
      document.getElementById('modal-title').textContent = 'Edit Nurse';
      document.getElementById('nurse-id').value = n.id;
      document.getElementById('n-name').value = n.name;
      document.getElementById('n-email').value = n.email;
      document.getElementById('n-phone').value = n.phone || '';
      document.getElementById('n-dept').value = n.department;
      document.getElementById('n-shift').value = n.shift;
      document.getElementById('n-status').value = n.is_active ? '1' : '0';
      openModal('nurse-modal');
    }

    async function saveNurse() {
      const id = document.getElementById('nurse-id').value;
      const btn = document.getElementById('save-nurse-btn');
      const name = document.getElementById('n-name').value.trim();
      const email = document.getElementById('n-email').value.trim();
      const dept = document.getElementById('n-dept').value;
      const shift = document.getElementById('n-shift').value;

      if (!name || !email || !dept || !shift) { 
        showToast('warning', 'Validation', 'Name, email, department and shift are required.'); 
        return; 
      }

      btn.classList.add('btn-loading'); btn.disabled = true;

      const body = {
        name, email, 
        phone: document.getElementById('n-phone').value.trim(),
        department: dept,
        shift: shift,
        is_active: document.getElementById('n-status').value === '1'
      };

      const res = id
        ? await api.put(`/admin/nurses/${id}`, body, true)
        : await api.post('/admin/nurses', body, true);

      btn.classList.remove('btn-loading'); btn.disabled = false;

      if (res && res.success) {
        closeModal('nurse-modal');
        showToast('success', id ? 'Nurse Updated' : 'Nurse Added', res.message);
        await loadNurses();
      } else {
        showToast('error', 'Error', res?.message || 'Failed to save nurse.');
      }
    }

    async function deleteNurse(id, name) {
      if (!confirm(`Are you sure you want to remove Nurse ${name}? This cannot be undone.`)) return;
      const res = await api.delete(`/admin/nurses/${id}`, true);
      if (res && res.success) {
        showToast('success', 'Nurse Removed', `Nurse ${name} has been removed.`);
        await loadNurses();
      } else {
        showToast('error', 'Error', res?.message || 'Failed to delete nurse.');
      }
    }
  </script>
</body>
</html>
