<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
</head>
<body>
  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="../../pages/index.html" class="sidebar-brand">
          <div class="sidebar-brand-icon" style="width: 32px; height: 32px;"><svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="40" rx="10" fill="#1a56db"/><path d="M20 10v20M10 20h20" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="20" r="14" stroke="#60a5fa" stroke-width="1.5" opacity=".4"/></svg></div>
          <span class="sidebar-brand-name">MediCare Admin</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section">
          <div class="sidebar-section-label">Overview</div>
          <a href="/pages/admin/dashboard.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></span> Dashboard</a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-label">Management</div>
          <a href="/pages/admin/doctors.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></span> Doctors</a>
          <a href="/pages/admin/nurses.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span> Nurses</a>
          <a href="/pages/admin/patients.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span> Patients</a>
          <a href="/pages/admin/appointments.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span> Appointments</a>
          <a href="/pages/admin/beds.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20M5 17V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v12M9 8h6M9 12h6"></path></svg></span> Bed Occupancy</a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-label">Tools</div>
          <a href="/pages/admin/announcement.html" class="sidebar-link active"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></span> Announcement</a>
          <a href="/pages/index.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></span> View Website</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="sidebar-avatar">A</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-name">Admin</div>
            <div class="sidebar-user-role">Administrator</div>
          </div>
        </div>
        <button class="btn btn-secondary w-full btn-sm" onclick="logout()">Logout</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <div class="dashboard-topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
          <div class="topbar-title">Hospital Announcement</div>
        </div>
      </div>

      <div class="dashboard-content">
        <div class="card" style="max-width:640px;">
          <div class="card-header">
            <div class="card-title" style="display:inline-flex;align-items:center;gap:8px;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--primary);"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
              Active Announcement
            </div>
          </div>
          <div id="current-announcement" class="announcement-banner" style="margin-bottom:24px;">
            <div class="loader"><div class="spinner"></div></div>
          </div>
          <div class="form-group">
            <label class="form-label">Set New Announcement</label>
            <textarea id="announcement-text" class="form-control" rows="4" placeholder="e.g., Emergency services available 24/7. Book appointments online!"></textarea>
            <div class="form-hint">This message will be displayed as a banner on the hospital homepage.</div>
          </div>
          <button class="btn btn-primary" style="display:inline-flex;align-items:center;gap:8px;" id="save-ann-btn" onclick="saveAnnouncement()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            Publish Announcement
          </button>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      requireAdminLogin();
      initSidebarToggle();
      const user = getUser();
      document.getElementById('sidebar-name').textContent = user.name;
      document.getElementById('sidebar-avatar').textContent = user.name.charAt(0);
      await loadAnnouncement();
    });

    async function loadAnnouncement() {
      const container = document.getElementById('current-announcement');
      try {
        const res = await fetch('http://localhost:5000/api/announcement');
        const data = await res.json();
        if (data.success && data.data) {
          container.innerHTML = `<span class="banner-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px;"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></span><p>${data.data.message}</p>`;
          document.getElementById('announcement-text').value = data.data.message;
        } else {
          container.innerHTML = '<span class="banner-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:2px;"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg></span><p>No active announcement.</p>';
        }
      } catch { container.innerHTML = '<p>Failed to load.</p>'; }
    }

    async function saveAnnouncement() {
      const message = document.getElementById('announcement-text').value.trim();
      if (!message) { showToast('warning', 'Required', 'Please enter an announcement message.'); return; }

      const btn = document.getElementById('save-ann-btn');
      btn.classList.add('btn-loading'); btn.disabled = true;

      const res = await api.post('/admin/announcement', { message }, true);
      btn.classList.remove('btn-loading'); btn.disabled = false;

      if (res && res.success) {
        showToast('success', 'Announcement Published!', 'The announcement is now live on the website.');
        await loadAnnouncement();
      } else {
        showToast('error', 'Error', res?.message || 'Failed to publish.');
      }
    }
  </script>
</body>
</html>
