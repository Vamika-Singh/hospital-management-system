<head>

  <link rel="stylesheet" href="../../css/components.css" />

</head>
<body>

        <a href="../../pages/index.html" class="sidebar-brand">

          <span class="sidebar-brand-name">MediCare Admin</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section">
          <div class="sidebar-section-label">Overview</div>
          <a href="/pages/admin/dashboard.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></span> Dashboard</a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-label">Management</div>
          <a href="/pages/admin/doctors.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></span> Doctors</a>
          <a href="/pages/admin/nurses.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span> Nurses</a>
          <a href="/pages/admin/patients.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span> Patients</a>
          <a href="/pages/admin/appointments.html" class="sidebar-link active"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span> Appointments</a>
          <a href="/pages/admin/beds.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20M5 17V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v12M9 8h6M9 12h6"></path></svg></span> Bed Occupancy</a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-label">Tools</div>
          <a href="/pages/admin/announcement.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></span> Announcement</a>
          <a href="/pages/index.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></span> View Website</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="sidebar-avatar">A</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-name">Admin</div>
            <div class="sidebar-user-role">Administrator</div>
          </div>
        </div>
        <button class="btn btn-secondary w-full btn-sm" onclick="logout()">Logout</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="dashboard-main">
      <div class="dashboard-topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
          <div class="topbar-title">Manage Appointments</div>
        </div>
      </div>

      <div class="dashboard-content">
        <!-- Filters -->
        <div class="card" style="margin-bottom:20px;">
          <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;">
            <div class="form-group" style="margin:0;flex:1;min-width:160px;">
              <label class="form-label">Filter by Status</label>
              <select id="filter-status" class="form-control" onchange="loadAppointments()">
                <option value="all">All Statuses</option>
                <option value="pending">Pending</option>
                <option value="confirmed">Confirmed</option>
                <option value="completed">Completed</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>
            <div class="form-group" style="margin:0;flex:1;min-width:160px;">
              <label class="form-label">Filter by Date</label>
              <input type="date" id="filter-date" class="form-control" onchange="loadAppointments()" />
            </div>
            <button class="btn btn-secondary btn-sm" onclick="clearFilters()">Clear Filters</button>
          </div>
        </div>

        <div class="table-wrapper">
          <table class="table">
            <thead><tr><th>#</th><th>Patient</th><th>Doctor</th><th>Date & Time</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="appts-tbody"><tr><td colspan="7"><div class="loader"><div class="spinner"></div></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Update Status Modal -->
  <div class="modal-overlay" id="status-modal">
    <div class="modal">
      <div class="modal-header"><div class="modal-title">Update Appointment Status</div><button class="modal-close" onclick="closeModal('status-modal')">✕</button></div>
      <div class="modal-body">
        <input type="hidden" id="edit-appt-id" />
        <div class="form-group">
          <label class="form-label">New Status</label>
          <select id="edit-status" class="form-control">
            <option value="pending">Pending</option>
            <option value="confirmed">Confirmed</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>
        
        <div id="complete-fields" style="display:none; margin-bottom: 20px; padding: 16px; background: var(--primary-50); border-radius: var(--radius-sm); border: 1px solid rgba(26, 86, 219, 0.1);">
          <div class="form-group" style="margin-bottom: 12px;">
            <label class="form-label" style="color: var(--primary);">Clinical Diagnosis</label>
            <input type="text" id="edit-diagnosis" class="form-control" placeholder="e.g. Essential Hypertension, Acute Bronchitis" />
          </div>
          <div class="form-group" style="margin: 0;">
            <label class="form-label" style="color: var(--primary);">Prescription & Dosage Schedule</label>
            <textarea id="edit-prescription" class="form-control" rows="3" placeholder="e.g. Amlodipine 5mg - Once daily for 30 days&#10;Paracetamol 500mg - Twice daily for 5 days"></textarea>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Doctor's Clinical Notes (optional)</label>
          <textarea id="edit-notes" class="form-control" rows="3" placeholder="Add any notes or observations..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('status-modal')">Cancel</button>
        <button class="btn btn-primary" id="save-status-btn" onclick="saveStatus()">Update Status</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      requireAdminLogin();
      initSidebarToggle();
      const user = getUser();
      document.getElementById('sidebar-name').textContent = user.name;
      document.getElementById('sidebar-avatar').textContent = user.name.charAt(0);
      loadAppointments();

      document.getElementById('edit-status').addEventListener('change', (e) => {
        const isCompleted = e.target.value === 'completed';
        document.getElementById('complete-fields').style.display = isCompleted ? 'block' : 'none';
      });
    });

    async function loadAppointments() {
      const status = document.getElementById('filter-status').value;
      const date = document.getElementById('filter-date').value;
      const tbody = document.getElementById('appts-tbody');
      tbody.innerHTML = '<tr><td colspan="7"><div class="loader"><div class="spinner"></div></div></td></tr>';

      const params = new URLSearchParams();
      if (status && status !== 'all') params.append('status', status);
      if (date) params.append('date', date);

      const res = await api.get(`/admin/appointments?${params}`, true);

      if (!res || !res.success) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--yellow);"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg></div><h3>Failed to load appointments</h3></div></td></tr>';
        return;
      }

      const appts = res.data;
      if (appts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted);"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></div><h3>No appointments found</h3></div></td></tr>';
        return;
      }

      tbody.innerHTML = appts.map(a => `
        <tr>
          <td>#${a.id}</td>
          <td><strong>${a.patient_name}</strong><br><span style="font-size:12px;color:var(--text-muted);">${a.patient_phone||a.patient_email}</span></td>
          <td>${a.doctor_name}<br><span style="font-size:12px;color:var(--primary);">${a.specialization}</span></td>
          <td><strong>${formatDate(a.appointment_date)}</strong><br><span style="font-size:12px;color:var(--text-secondary);">${formatTime(a.appointment_time)}</span></td>
          <td style="max-width:150px;"><span style="font-size:13px;color:var(--text-secondary);">${a.reason||'—'}</span></td>
          <td><span class="badge badge-${a.status}">${a.status}</span></td>
          <td>
            <button class="btn btn-secondary btn-sm" style="display:inline-flex;align-items:center;gap:6px;" onclick="openStatusModal(${a.id},'${a.status}','${(a.notes||'').replace(/'/g,"\\'")}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> Update</button>
          </td>
        </tr>
      `).join('');
    }

    function clearFilters() {
      document.getElementById('filter-status').value = 'all';
      document.getElementById('filter-date').value = '';
      loadAppointments();
    }

    function openStatusModal(id, status, notes) {
      document.getElementById('edit-appt-id').value = id;
      document.getElementById('edit-status').value = status;
      document.getElementById('edit-notes').value = notes;
      
      // Reset diagnosis and prescription inputs
      document.getElementById('edit-diagnosis').value = '';
      document.getElementById('edit-prescription').value = '';
      
      // Toggle visibility based on initial status
      const isCompleted = status === 'completed';
      document.getElementById('complete-fields').style.display = isCompleted ? 'block' : 'none';
      
      openModal('status-modal');
    }

    async function saveStatus() {
      const id = document.getElementById('edit-appt-id').value;
      const status = document.getElementById('edit-status').value;
      const notes = document.getElementById('edit-notes').value.trim();
      const diagnosis = document.getElementById('edit-diagnosis').value.trim();
      const prescription = document.getElementById('edit-prescription').value.trim();
      const btn = document.getElementById('save-status-btn');

      if (status === 'completed' && (!diagnosis || !prescription)) {
        showToast('error', 'Fields Required', 'Diagnosis findings and prescription schedule are required to mark appointment as completed.');
        return;
      }

      btn.classList.add('btn-loading'); btn.disabled = true;
      const res = await api.put(`/admin/appointments/${id}/status`, { 
        status, 
        notes,
        diagnosis: status === 'completed' ? diagnosis : null,
        prescription: status === 'completed' ? prescription : null
      }, true);
      btn.classList.remove('btn-loading'); btn.disabled = false;

      if (res && res.success) {
        closeModal('status-modal');
        showToast('success', 'Status Updated', res.message);
        await loadAppointments();
      } else {
        showToast('error', 'Error', res?.message || 'Failed to update status.');
      }
    }
  </script>
</body>
</html>
