<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — MediCare</title>
  <meta name="description" content="MediCare admin dashboard with analytics and overview statistics." />
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="../../css/components.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
</head>
<body>
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="../../pages/index.html" class="sidebar-brand">
          <div class="sidebar-brand-icon" style="width: 32px; height: 32px;"><svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="40" height="40" rx="10" fill="#1a56db"/><path d="M20 10v20M10 20h20" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="20" cy="20" r="14" stroke="#60a5fa" stroke-width="1.5" opacity=".4"/></svg></div>
          <span class="sidebar-brand-name">MediCare Admin</span>
        </a>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-section">
          <div class="sidebar-section-label">Overview</div>
          <a href="/pages/admin/dashboard.html" class="sidebar-link active"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg></span> Dashboard</a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-label">Management</div>
          <a href="/pages/admin/doctors.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg></span> Doctors</a>
          <a href="/pages/admin/nurses.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span> Nurses</a>
          <a href="/pages/admin/patients.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span> Patients</a>
          <a href="/pages/admin/appointments.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span> Appointments</a>
          <a href="/pages/admin/beds.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20M5 17V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v12M9 8h6M9 12h6"></path></svg></span> Bed Occupancy</a>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-section-label">Tools</div>
          <a href="/pages/admin/announcement.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></span> Announcement</a>
          <a href="/pages/index.html" class="sidebar-link"><span class="link-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></span> View Website</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-user-avatar" id="sidebar-avatar">A</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebar-name">Admin</div>
            <div class="sidebar-user-role">Administrator</div>
          </div>
        </div>
        <button class="btn btn-secondary w-full btn-sm" onclick="logout()">Logout</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Main -->
    <main class="dashboard-main">
      <div class="dashboard-topbar">
        <div style="display:flex;align-items:center;gap:12px;">
          <button class="sidebar-toggle" id="sidebar-toggle">☰</button>
          <div class="topbar-title">Dashboard Overview</div>
        </div>
        <div class="topbar-actions">
          <span id="today-date" style="font-size:13px;color:var(--text-secondary);"></span>
        </div>
      </div>

      <div class="dashboard-content">
        <!-- Stats Grid -->
        <div class="stats-grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr));" id="stats-grid">
          <div class="loader"><div class="spinner"></div></div>
        </div>

        <!-- Charts Row -->
        <div class="charts-row">
          <div class="chart-container">
            <div class="chart-title">Appointments — Last 7 Days</div>
            <canvas id="bar-chart" height="200"></canvas>
          </div>
          <div class="chart-container">
            <div class="chart-title">By Specialization</div>
            <canvas id="donut-chart" height="200"></canvas>
            <div id="donut-legend" style="margin-top:16px;"></div>
          </div>
        </div>

        <!-- Status Summary -->
        <div class="card" style="margin-bottom:24px;">
          <div class="card-header"><div class="card-title">Appointment Status Breakdown</div></div>
          <div id="status-bars"></div>
        </div>

        <!-- Recent Appointments -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">Recent Appointments</div>
            <a href="/pages/admin/appointments.html" class="btn btn-secondary btn-sm">View All</a>
          </div>
          <div class="table-wrapper" id="recent-table">
            <div class="loader"><div class="spinner"></div></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast-container"></div>

  <script src="../../js/api.js"></script>
  <script src="../../js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      requireAdminLogin();
      initSidebarToggle();

      const user = getUser();
      document.getElementById('sidebar-name').textContent = user.name;
      document.getElementById('sidebar-avatar').textContent = user.name.charAt(0).toUpperCase();
      document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });

      await loadDashboard();
    });

    async function loadDashboard() {
      const res = await api.get('/admin/dashboard', true);
      if (!res || !res.success) { showToast('error', 'Error', 'Failed to load dashboard data.'); return; }
      const d = res.data;

      // Stats
      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card">
          <div class="stat-icon blue">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
          </div>
          <div class="stat-info"><div class="stat-value">${d.totalDoctors}</div><div class="stat-label">Active Doctors</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </div>
          <div class="stat-info"><div class="stat-value">${d.totalPatients}</div><div class="stat-label">Registered Patients</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon purple">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          </div>
          <div class="stat-info"><div class="stat-value">${d.totalAppointments}</div><div class="stat-label">Total Appointments</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon yellow">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path><path d="M16 18h.01"></path></svg>
          </div>
          <div class="stat-info"><div class="stat-value">${d.todayAppointments}</div><div class="stat-label">Today's Appointments</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon yellow">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          </div>
          <div class="stat-info"><div class="stat-value">${d.pendingAppointments}</div><div class="stat-label">Pending</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
          </div>
          <div class="stat-info"><div class="stat-value">${d.completedAppointments}</div><div class="stat-label">Completed</div></div>
        </div>
      `;

      // Status bars
      const total = d.totalAppointments || 1;
      const statuses = [
        { label:'Pending', val:d.pendingAppointments, color:'var(--warning)' },
        { label:'Confirmed', val:d.confirmedAppointments, color:'var(--info)' },
        { label:'Completed', val:d.completedAppointments, color:'var(--success)' },
        { label:'Cancelled', val:d.cancelledAppointments, color:'var(--danger)' },
      ];
      document.getElementById('status-bars').innerHTML = statuses.map(s => `
        <div style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
            <span style="color:var(--text-secondary);">${s.label}</span>
            <span style="font-weight:700;color:var(--text-primary);">${s.val}</span>
          </div>
          <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden;">
            <div style="height:100%;width:${Math.round((s.val/total)*100)}%;background:${s.color};border-radius:4px;transition:width 1s ease;"></div>
          </div>
        </div>
      `).join('');

      // Bar Chart (Canvas API)
      drawBarChart(d.perDay);

      // Donut Chart (Canvas API)
      drawDonutChart(d.perSpec);

      // Recent Appointments Table
      if (!d.recentAppointments || d.recentAppointments.length === 0) {
        document.getElementById('recent-table').innerHTML = '<div class="empty-state"><div class="empty-icon">📋</div><h3>No appointments yet</h3></div>';
        return;
      }

      document.getElementById('recent-table').innerHTML = `
        <table class="table">
          <thead><tr>
            <th>ID</th><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th>
          </tr></thead>
          <tbody>
            ${d.recentAppointments.map(a => `
              <tr>
                <td>#${a.id}</td>
                <td>${a.patient_name}</td>
                <td>${a.doctor_name}<br><span style="font-size:11px;color:var(--text-muted);">${a.specialization}</span></td>
                <td>${formatDate(a.appointment_date)}</td>
                <td>${formatTime(a.appointment_time)}</td>
                <td><span class="badge badge-${a.status}">${a.status}</span></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function drawBarChart(perDay) {
      const canvas = document.getElementById('bar-chart');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = 200;

      // Build last 7 days
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().split('T')[0];
        const label = d.toLocaleDateString('en-IN', { weekday:'short', day:'numeric' });
        const found = perDay.find(p => p.date.split('T')[0] === key);
        days.push({ label, count: found ? parseInt(found.count) : 0 });
      }

      const max = Math.max(...days.map(d => d.count), 1);
      const W = canvas.width, H = canvas.height;
      const padding = 40, barWidth = (W - padding * 2) / days.length * 0.6;
      const gap = (W - padding * 2) / days.length;

      ctx.clearRect(0, 0, W, H);

      // Grid lines
      for (let i = 0; i <= 4; i++) {
        const y = padding + (H - padding * 2) * (i / 4);
        ctx.beginPath(); ctx.strokeStyle = 'rgba(148, 163, 184, 0.15)'; ctx.lineWidth = 1;
        ctx.moveTo(padding, y); ctx.lineTo(W - padding, y); ctx.stroke();
      }

      days.forEach((day, i) => {
        const x = padding + gap * i + gap / 2 - barWidth / 2;
        const barH = max > 0 ? ((day.count / max) * (H - padding * 2)) : 0;
        const y = H - padding - barH;

        // Gradient bar
        const grad = ctx.createLinearGradient(0, y, 0, H - padding);
        grad.addColorStop(0, '#0ea5e9');
        grad.addColorStop(1, '#6366f1');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, barH, 4);
        ctx.fill();

        // Value label
        if (day.count > 0) {
          ctx.fillStyle = '#0f172a';
          ctx.font = '500 11px Inter';
          ctx.textAlign = 'center';
          ctx.fillText(day.count, x + barWidth / 2, y - 6);
        }

        // Day label
        ctx.fillStyle = '#475569';
        ctx.font = '500 11px Inter';
        ctx.textAlign = 'center';
        ctx.fillText(day.label, x + barWidth / 2, H - padding + 16);
      });
    }

    function drawDonutChart(perSpec) {
      const canvas = document.getElementById('donut-chart');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = 200;

      if (!perSpec || perSpec.length === 0) {
        ctx.fillStyle = '#64748b'; ctx.font = '14px Inter'; ctx.textAlign = 'center';
        ctx.fillText('No data yet', canvas.width/2, canvas.height/2);
        return;
      }

      const colors = ['#0ea5e9','#6366f1','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899'];
      const total = perSpec.reduce((s, p) => s + parseInt(p.count), 0);
      const cx = canvas.width / 2, cy = canvas.height / 2, r = Math.min(cx, cy) - 20;
      let startAngle = -Math.PI / 2;

      perSpec.forEach((spec, i) => {
        const slice = (parseInt(spec.count) / total) * 2 * Math.PI;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.arc(cx, cy, r, startAngle, startAngle + slice);
        ctx.closePath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.fill();
        startAngle += slice;
      });

      // Center hole
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.55, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff'; ctx.fill();

      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 22px Outfit'; ctx.textAlign = 'center';
      ctx.fillText(total, cx, cy + 4);
      ctx.fillStyle = '#475569'; ctx.font = '500 11px Inter';
      ctx.fillText('Total', cx, cy + 20);

      // Legend
      document.getElementById('donut-legend').innerHTML = perSpec.map((s, i) => `
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px;">
          <div style="width:10px;height:10px;border-radius:2px;background:${colors[i % colors.length]};flex-shrink:0;"></div>
          <span style="color:var(--text-secondary);flex:1;">${s.specialization}</span>
          <span style="font-weight:700;color:var(--text-primary);">${s.count}</span>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
